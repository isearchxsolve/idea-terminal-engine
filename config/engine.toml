# Engine runtime configuration. Source code must never hardcode these values.

[pacing]
max_in_flight = 1
min_interval_seconds = 3.0
backoff_base_seconds = 5.0
backoff_max_seconds = 120.0

[budget]
max_inference_calls = 4000
max_retries_per_task = 5

[inference]
timeout_seconds = 300
max_output_tokens = 16384

[exec]
timeout_seconds = 120
allowed_commands = ["python", "py", "node", "npx", "npm"]
